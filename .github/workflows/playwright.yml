# Playwright E2E: chromium (unauthenticated) + authenticated project.
# Authenticated tests need E2E_TEST_USER_EMAIL, E2E_TEST_USER_PASSWORD, and Supabase env.
# Global setup fails in CI when those are missing or invalid.
name: Playwright E2E

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PLAYWRIGHT_BASE_URL: http://localhost:3000
  CI: "true"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd apps/web && pnpm exec playwright install --with-deps chromium

      - name: Start Next.js dev server
        run: |
          cd apps/web && pnpm dev &
          npx wait-on@7 --timeout 120000 http://localhost:3000

      - name: Run Playwright
        working-directory: apps/web
        env:
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm run test:e2e
