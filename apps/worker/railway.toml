# Worker service config. Root Directory for worker cron services MUST be apps/worker
# so Railway uses this file (not apps/api/railway.toml).
# Worker runs one-shot scripts via Cron; no long-lived server.

[build]
builder = "nixpacks"
# Use corepack (no npm -g). corepack run pnpm@... avoids PATH issues after prepare.
buildCommand = "corepack enable && corepack prepare pnpm@9.15.0 --activate && corepack run pnpm@9.15.0 install && corepack run pnpm@9.15.0 run build"

# Do NOT set startCommand to a server. Cron services override start per run:
# Daily: pnpm run sync:x:profiles:daily
# Weekly: pnpm run sync:x:tweets:weekly
# Drainer: pnpm run run:jobs
[deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
