<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // ⚡ NUCLEAR OPTION: Suppress ALL Web3/EVM warnings immediately
      (function() {
        'use strict';
        if (!window.console) return;
        
        // Save original methods
        const _warn = console.warn;
        const _error = console.error;
        const _log = console.log;
        
        // Ultra-aggressive filter
        const shouldBlock = (args) => {
          try {
            const msg = Array.prototype.slice.call(args).join(' ').toLowerCase();
            return msg.includes('injected') || 
                   msg.includes('evm') || 
                   msg.includes('proxy') || 
                   msg.includes('wallet') || 
                   msg.includes('ethereum') || 
                   msg.includes('provider') ||
                   msg.includes('metamask') ||
                   msg.includes('coinbase') ||
                   msg.includes('rabby') ||
                   msg.includes('phantom') ||
                   msg.includes('web3') ||
                   msg.includes('request method') ||
                   msg.includes('send method') ||
                   msg.includes('sendasync');
          } catch (e) {
            return false;
          }
        };
        
        // Override with non-configurable properties
        try {
          Object.defineProperty(console, 'warn', {
            value: function() { 
              if (!shouldBlock(arguments)) {
                _warn.apply(console, arguments); 
              }
            },
            writable: false,
            configurable: false
          });
          
          Object.defineProperty(console, 'error', {
            value: function() { 
              if (!shouldBlock(arguments)) {
                _error.apply(console, arguments); 
              }
            },
            writable: false,
            configurable: false
          });
          
          Object.defineProperty(console, 'log', {
            value: function() { 
              if (!shouldBlock(arguments)) {
                _log.apply(console, arguments); 
              }
            },
            writable: false,
            configurable: false
          });
        } catch (e) {
          // Fallback if defineProperty fails
          console.warn = function() { if (!shouldBlock(arguments)) _warn.apply(console, arguments); };
          console.error = function() { if (!shouldBlock(arguments)) _error.apply(console, arguments); };
          console.log = function() { if (!shouldBlock(arguments)) _log.apply(console, arguments); };
        }
        
        // Also intercept at window level
        if (window.addEventListener) {
          window.addEventListener('error', function(e) {
            if (e && e.message) {
              const msg = e.message.toLowerCase();
              if (msg.includes('injected') || msg.includes('evm') || msg.includes('proxy')) {
                e.preventDefault();
                e.stopPropagation();
                return false;
              }
            }
          }, true);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linkary - Web3 Reputation Infrastructure</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
